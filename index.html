<!-- GERBANG PEMBUKA: pintu gebyok yang terbuka saat "Buka Gerbang" ditekan.
     Muncul setiap kali aplikasi dibuka dari beranda; dilewati bila membuka tautan motif langsung (diatur app.ts). -->
<section id="gerbang" aria-label="Pembuka JEPARA Woodtech">
  <svg class="g-pola" aria-hidden="true"><rect width="100%" height="100%" fill="url(#g-pola-sulur)"/></svg>
  <div class="g-sorot" aria-hidden="true"></div>
  <span class="g-lencana"><img src="logo-snt.png" alt="Logo SNT" width="42" height="33">SNT 14 JEPARA</span>
  <div class="g-cap">
    <h1 class="g-judul"><span class="g-j1" id="g-j1">JEPARA</span><span class="g-j2" id="g-j2">Woodtech</span></h1>
    <p class="g-sub">Ensiklopedia Motif Ukir</p>
  </div>
  <div class="g-pintu" id="g-pintu" aria-hidden="true">
    <div class="g-cahaya"></div>
    <svg class="g-kusen" viewBox="0 0 300 330">
      <path d="M150 6 C118 6 96 26 86 50 L214 50 C204 26 182 6 150 6Z" fill="#5c3820" stroke="#e0ad5f" stroke-width="2.5"/>
      <use href="#g-relung" x="122" y="12" width="56" height="38" color="#e0ad5f"/>
      <rect x="22" y="50" width="256" height="24" rx="3" fill="#6b4024" stroke="#3a2212" stroke-width="2"/>
      <path d="M40 62 C52 54 64 70 76 62 S100 54 112 62 S136 70 150 62 S176 54 188 62 S212 70 224 62 S248 54 260 62" fill="none" stroke="#e0ad5f" stroke-width="2" stroke-linecap="round"/>
      <rect x="22" y="74" width="17" height="250" fill="#6b4024" stroke="#3a2212" stroke-width="2"/>
      <rect x="261" y="74" width="17" height="250" fill="#6b4024" stroke="#3a2212" stroke-width="2"/>
      <rect x="12" y="318" width="276" height="10" rx="3" fill="#4f2f19"/>
    </svg>
    <div class="g-daun kiri"><svg viewBox="0 0 110 230" preserveAspectRatio="none"><use href="#g-daun-pintu"/></svg></div>
    <div class="g-daun kanan"><svg viewBox="0 0 110 230" preserveAspectRatio="none"><use href="#g-daun-pintu"/></svg></div>
  </div>
  <div class="g-bayang" aria-hidden="true"></div>
  <!-- Tombol berbentuk KUNCI: kepala bulat + batang bertulisan + gigi. Saat ditekan, kunci diputar lalu pintu terbuka. -->
  <button type="button" class="g-tombol" id="g-buka">
    <span class="g-kunci-kepala" aria-hidden="true"></span><span class="g-kunci-batang">Buka Gerbang</span><span class="g-kunci-gigi" aria-hidden="true"></span>
  </button>
  <p class="g-kaki">Karya <b>Tim Siswa SNT 14 JEPARA</b><br>bersama para perajin ukir Desa Mulyoharjo</p>
</section>

<header id="kepala">
