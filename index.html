<!-- GERBANG PEMBUKA: gebyok layar penuh. Tampil di alamat #/ (pembuka); setelah kunci diputar → #/beranda.
     Tombol kembali HP / ikon pintu di kepala aplikasi membawa kembali ke sini (diatur app.ts).
     Hiasan = FOTO UKIRAN ASLI dari lapangan (23 Nov 2026), diwarnai emas-cokelat (gerbang/*.webp). -->
<section id="gerbang" aria-label="Pembuka JEPARA Woodtech">
  <div class="g-ambang">
    <svg class="g-pola" aria-hidden="true"><rect width="100%" height="100%" fill="url(#g-pola-sulur)"/></svg>
    <span class="g-lencana"><img src="logo-snt.png" alt="Logo SNT" width="38" height="30">SNT 14 JEPARA</span>
    <div class="g-cap">
      <h1 class="g-judul"><span class="g-j1" id="g-j1">JEPARA</span><span class="g-j2" id="g-j2">Woodtech</span></h1>
      <p class="g-sub">Ensiklopedia Motif Ukir</p>
    </div>
  </div>
  <div class="g-pintu" id="g-pintu">
    <div class="g-cahaya" aria-hidden="true"></div>
    <div class="g-daun kiri" aria-hidden="true">
      <div class="g-panel atas"><span class="g-medalion"></span></div>
      <span class="g-gagang"></span>
      <div class="g-panel bawah"><span class="g-bunga"></span></div>
    </div>
    <div class="g-daun kanan" aria-hidden="true">
      <div class="g-panel atas"><span class="g-medalion"></span></div>
      <span class="g-gagang"></span>
      <div class="g-panel bawah"><span class="g-bunga"></span></div>
    </div>
    <div class="g-kunci-wadah">
      <button type="button" class="g-tombol" id="g-buka">
        <span class="g-kunci-kepala" aria-hidden="true"></span><span class="g-kunci-batang">Buka Gerbang</span><span class="g-kunci-gigi" aria-hidden="true"></span>
      </button>
      <span class="g-plat" aria-hidden="true"></span>
    </div>
    <p class="g-kaki">Karya <b>Tim Siswa SNT 14 JEPARA</b><br>bersama para perajin ukir Desa Mulyoharjo</p>
  </div>
</section>

<!-- Latar pola sulur untuk seluruh aplikasi (sama dengan gerbang) -->
<svg class="latar-pola" aria-hidden="true"><rect width="100%" height="100%" fill="url(#g-pola-sulur)"/></svg>

<header id="kepala">
  <button type="button" class="ikon" id="tombol-kembali" aria-label="Kembali" hidden><svg><use href="#i-kembali"/></svg></button>
  <a href="#/beranda" class="merek" aria-label="JEPARA Woodtech, ke beranda">JEPARA<i>Woodtech</i></a>
  <span id="judul-layar" class="judul-layar">Ensiklopedia motif ukir</span>
  <a href="#/" class="ikon-gerbang" aria-label="Kembali ke gerbang" title="Kembali ke gerbang"><svg aria-hidden="true"><use href="#i-pintu"/></svg></a>
  <span id="lencana-offline" class="lencana-offline" title="Status offline"></span>
</header>

<main id="isi" tabindex="-1">
  <p class="memuat">Memuat…</p>
</main>

<!-- Penampil foto layar penuh -->
<div id="penampil" hidden>
  <button type="button" class="ikon tutup" id="penampil-tutup" aria-label="Tutup">✕</button>
  <img id="penampil-gambar" alt="">
  <p id="penampil-teks"></p>
</div>
